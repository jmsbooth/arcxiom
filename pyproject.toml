[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcxiom-prototype"
version = "0.1.0a0"
description = "Experimental YAML-first Architecture-as-Code reference prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "reportlab>=4.0,<5"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pymupdf>=1.24,<2"]

[project.scripts]
arcxiom = "arcxiom.cli:main"
arch = "arcxiom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
