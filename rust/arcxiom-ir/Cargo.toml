[package]
name = "arcxiom-ir"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
name = "arcxiom_ir"
path = "src/lib.rs"

[[bin]]
name = "arcxiom"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.1.1"
sha2 = "0.10"
