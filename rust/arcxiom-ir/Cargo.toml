[package]
name = "arcxiom-ir"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "arcxiom_ir"
path = "src/lib.rs"

[[bin]]
name = "arcxiom"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.10"
