name: Rust kernel qualification

on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Only the latest PR HEAD should consume multi-platform runner minutes.
concurrency:
  group: rust-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-kernel:
    name: kernel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned stable action 2026-11-15
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Enforce reviewed Cargo dependency lockfile
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --manifest-path rust/arcxiom-ir/Cargo.toml > /dev/null
          git diff --exit-code -- rust/arcxiom-ir/Cargo.lock
      - name: Verify format
        shell: bash
        run: cargo fmt --manifest-path rust/arcxiom-ir/Cargo.toml -- --check
      - name: Clippy warnings are errors
        shell: bash
        run: cargo clippy --locked --manifest-path rust/arcxiom-ir/Cargo.toml --all-targets -- -D warnings
      - name: Rust unit, adversarial, performance, property and integration tests
        shell: bash
        run: cargo test --locked --manifest-path rust/arcxiom-ir/Cargo.toml --all-targets
      - name: Release compilation and Rust-only CLI smoke
        shell: bash
        run: |
          cargo build --locked --release --manifest-path rust/arcxiom-ir/Cargo.toml
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=rust/arcxiom-ir/target/release/arcxiom.exe; else EXE=rust/arcxiom-ir/target/release/arcxiom; fi
          "$EXE" --version
          "$EXE" validate examples/emergency-response.arch.yaml --json
          "$EXE" validate examples/zero-trust-federation.arch.yaml
          "$EXE" export examples/emergency-response.arch.yaml --format json -o rust-archir.json
          "$EXE" verify rust-archir.json
          "$EXE" query examples/emergency-response.arch.yaml --id role.dispatcher --direction outgoing --depth 8 --json
          "$EXE" diff examples/emergency-response.arch.yaml examples/emergency-response.arch.yaml --check-guardrails --json
          python -c 'import json; from pathlib import Path; ir=json.loads(Path("rust-archir.json").read_text()); assert ir["sha256"]==Path("tests/fixtures/emergency-response.digest").read_text().strip()'
      - name: Reference Python / Rust parity and CLI E2E
        shell: bash
        run: |
          python -m pip install -e . "jsonschema==4.26.0"
          python -m arcxiom query examples/emergency-response.arch.yaml --id role.dispatcher --direction outgoing --depth 8 --json > python-query.json
          python -m arcxiom query examples/zero-trust-federation.arch.yaml --id role.data-steward --depth 8 --json > python-federation-query.json
          python -m arcxiom diff examples/emergency-response.arch.yaml examples/emergency-response.arch.yaml --json > python-diff.json
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=rust/arcxiom-ir/target/release/arcxiom.exe; else EXE=rust/arcxiom-ir/target/release/arcxiom; fi
          "$EXE" query examples/emergency-response.arch.yaml --id role.dispatcher --direction outgoing --depth 8 --json > rust-query.json
          python scripts/check_conformance.py --compiler "$EXE" --python-reference --report conformance.json
          "$EXE" query examples/zero-trust-federation.arch.yaml --id role.data-steward --depth 8 --json > rust-federation-query.json
          "$EXE" diff examples/emergency-response.arch.yaml examples/emergency-response.arch.yaml --json > rust-diff.json
          python -c 'import json; from pathlib import Path; j=lambda p:json.loads(Path(p).read_text()); assert j("python-query.json")==j("rust-query.json"); assert j("python-federation-query.json")==j("rust-federation-query.json"); assert j("python-diff.json")==j("rust-diff.json")'
      - name: Verify release governance and execute approval negative tests
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          source=Path('tests/test_release_governance.py')
          spec=importlib.util.spec_from_file_location('release_policy_tests',source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests=[name for name in dir(module) if name.startswith('test_')]
          assert len(tests)>=5, f'expected at least 5 release controls, got {tests}'
          for name in tests:
              getattr(module,name)()
          print(f'{len(tests)} release governance controls passed')
          PY
      - name: Stage installable release-candidate binary with checksum and dependency inventory
        shell: bash
        run: |
          mkdir -p dist
          cp conformance.json dist/
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          out=pathlib.Path("dist")
          ext=".exe" if os.environ.get("RUNNER_OS")=="Windows" else ""
          system={"Linux":"linux-x86_64","macOS":"macos","Windows":"windows-x86_64"}[os.environ["RUNNER_OS"]]
          dest=out/f"arcxiom-v0.2.0a2-{system}{ext}"
          shutil.copyfile(pathlib.Path("rust/arcxiom-ir/target/release")/f"arcxiom{ext}",dest)
          dest.chmod(0o755)
          checksum=hashlib.sha256(dest.read_bytes()).hexdigest()
          (out/"SHA256SUMS").write_text(f"{checksum}  {dest.name}\n")
          metadata=json.loads(subprocess.check_output(["cargo","metadata","--locked","--format-version","1","--manifest-path","rust/arcxiom-ir/Cargo.toml"]))
          (out/"cargo-metadata.json").write_text(json.dumps(metadata,sort_keys=True,indent=2)+"\n")
          assert hashlib.sha256(dest.read_bytes()).hexdigest()==checksum
          PY
      - name: Dry-run exact maintainer-release ZIP packaging and checksums
        shell: bash
        run: |
          python scripts/package_release.py --output dist
          python - <<'PY'
          import hashlib,pathlib,subprocess,sys,tempfile,zipfile
          out=pathlib.Path("dist")
          archives=list(out.glob("arcxiom-v0.2.0a2-*.zip"))
          manifests=list(out.glob("SHA256SUMS.*"))
          assert len(archives)==len(manifests)==1
          claim,filename=manifests[0].read_text().strip().split()
          assert filename==archives[0].name
          assert claim==hashlib.sha256(archives[0].read_bytes()).hexdigest()
          with zipfile.ZipFile(archives[0]) as archive:
              assert archive.testzip() is None
              assert any(name.endswith("arcxiom") or name.endswith("arcxiom.exe") for name in archive.namelist())
          with tempfile.TemporaryDirectory() as other:
              subprocess.run([sys.executable, "scripts/package_release.py", "--output", other], check=True)
              for original in [archives[0], manifests[0]]:
                  assert original.read_bytes() == (pathlib.Path(other) / original.name).read_bytes()
          PY
      - name: Store nonpublished candidate binaries and audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcxiom-v0.2.0a2-${{ runner.os }}-candidate
          path: dist/
          if-no-files-found: error

  dependency-audit:
    name: dependency-audit / RustSec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned stable action 2026-11-15
        with:
          toolchain: '1.89.0'
      - name: No unmaintained YAML parser dependency
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          p=tomllib.loads(Path("rust/arcxiom-ir/Cargo.lock").read_text())
          names={x["name"] for x in p["package"]}
          assert "serde-saphyr" in names
          assert "unsafe-libyaml" not in names
          assert "serde_yaml" not in names
          PY
      - name: Install pinned RustSec audit CLI
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit entire locked Rust dependency graph
        run: cargo audit --file rust/arcxiom-ir/Cargo.lock
