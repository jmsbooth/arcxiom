name: Rust ArchIR parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust-ir:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Python exporter
        run: python -m pip install -e .
      - name: Export golden ArchIR
        run: arcxiom export examples/emergency-response.arch.yaml --output example-archir.json
      - name: Format and lint Rust
        run: |
          cargo fmt --manifest-path rust/arcxiom-ir/Cargo.toml
          cargo clippy --manifest-path rust/arcxiom-ir/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust/arcxiom-ir/Cargo.toml
      - name: Cross-language digest parity
        shell: bash
        run: |
          cargo run --manifest-path rust/arcxiom-ir/Cargo.toml --quiet -- verify example-archir.json > rust-digest.txt
          python -c 'from pathlib import Path; assert Path("tests/fixtures/emergency-response.digest").read_text().strip() in Path("rust-digest.txt").read_text()'
