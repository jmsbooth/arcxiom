name: Alpha distribution qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Build wheel from source
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel into fresh virtual environment
        shell: bash
        run: |
          python -m venv .venv-release
          .venv-release/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv-release/bin/arcxiom" validate "$GITHUB_WORKSPACE/examples/emergency-response.arch.yaml"
          "$GITHUB_WORKSPACE/.venv-release/bin/arcxiom" export "$GITHUB_WORKSPACE/examples/emergency-response.arch.yaml" --output /tmp/release-archir.json
          "$GITHUB_WORKSPACE/.venv-release/bin/arcxiom" render "$GITHUB_WORKSPACE/examples/emergency-response.arch.yaml" --format pdf --output /tmp/release-drawing.pdf
          test -s /tmp/release-archir.json
          test -s /tmp/release-drawing.pdf
      - name: Audit built distribution contents
        run: |
          python -c 'from pathlib import Path; import zipfile; w=list(Path("dist").glob("*.whl")); assert len(w)==1; z=zipfile.ZipFile(w[0]); n=z.namelist(); assert "arcxiom/cli.py" in n and "arcxiom/model.py" in n and "arcxiom/drawing.py" in n; assert any(x.endswith("/METADATA") for x in n); print("Wheel manifest OK:",len(n),"entries")'
      - name: Archive release candidate wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcxiom-v0.1.0a1-wheel
          path: dist/*.whl
          if-no-files-found: error
