name: Prepare v0.2.0a1 release draft (manual only)

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed main commit SHA
        required: true
        type: string
      acknowledge:
        description: Type v0.2.0a1 to confirm draft release preparation
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: arcxiom-release-v0.2.0a1
  cancel-in-progress: false

jobs:
  verify-approval:
    name: Human initiation and exact commit gate
    if: github.repository == 'jmsbooth/arcxiom' && github.actor == 'jmsbooth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require actual main protection before release preparation
        shell: bash
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')" = 'true'
      - name: Reject incorrect commit or typed approval
        env:
          EXPECTED: ${{ inputs.approved_commit }}
          CONFIRMATION: ${{ inputs.acknowledge }}
        run: |
          test "$CONFIRMATION" = 'v0.2.0a1'
          test "$EXPECTED" = "$GITHUB_SHA"
          test "${#EXPECTED}" -eq 40
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate exact commit and frozen release contract
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import pathlib,tomllib
          manifest=tomllib.loads(pathlib.Path('rust/arcxiom-ir/Cargo.toml').read_text())
          assert manifest['package']['version']=='0.2.0-alpha.1'
          assert pathlib.Path('docs/releases/v0.2.0a1.md').is_file()
          assert pathlib.Path('rust/arcxiom-ir/Cargo.lock').is_file()
          PY
      - name: Validate exact main SHA against all required CI and merged PR provenance
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/arcxiom-branch.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | @json' > "$RUNNER_TEMP/arcxiom-checks.ndjson"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" \
            --jq '.[] | @json' > "$RUNNER_TEMP/arcxiom-pulls.ndjson"
          python scripts/verify_release_qualification.py \
            --sha "$GITHUB_SHA" \
            --branch "$RUNNER_TEMP/arcxiom-branch.json" \
            --checks "$RUNNER_TEMP/arcxiom-checks.ndjson" \
            --pulls "$RUNNER_TEMP/arcxiom-pulls.ndjson" \
            --policy .github/main-protection.json
  build:
    name: Exact-source matrix artifact / ${{ matrix.os }}
    needs: verify-approval
    if: needs.verify-approval.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # pinned stable action 2026-11-15
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
      - name: Recheck qualification with pinned dependencies
        shell: bash
        run: |
          cargo fmt --manifest-path rust/arcxiom-ir/Cargo.toml -- --check
          cargo clippy --locked --manifest-path rust/arcxiom-ir/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/arcxiom-ir/Cargo.toml --all-targets
          cargo build --locked --release --manifest-path rust/arcxiom-ir/Cargo.toml
      - name: Package portable CLI and checksums using qualified shared code
        shell: bash
        run: |
          python scripts/package_release.py --output dist
          python - <<'PY'
          import pathlib,hashlib
          out=pathlib.Path("dist")
          archives=list(out.glob("arcxiom-v0.2.0a1-*.zip"))
          checks=list(out.glob("SHA256SUMS.*"))
          assert len(archives)==len(checks)==1
          claim, name=checks[0].read_text().strip().split()
          assert name==archives[0].name
          assert claim==hashlib.sha256(archives[0].read_bytes()).hexdigest()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcxiom-${{ runner.os }}
          path: dist/
          if-no-files-found: error
  create-draft:
    name: Stage unpublished draft; maintainer must explicitly publish
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: arcxiom-release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.2.0a1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download exact-run artifacts
        shell: bash
        run: |
          mkdir -p dist
          for os in Linux macOS Windows; do
            gh run download "$GITHUB_RUN_ID" -n "arcxiom-$os" -D dist
          done
      - name: Verify all checksums and no immutable version collision
        shell: bash
        run: |
          cd dist
          cat SHA256SUMS.* > SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name 'arcxiom-*.zip' | wc -l)" -eq 3
          cd ..
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refuse mutation" >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag already exists; refuse to move immutable ref" >&2
            exit 1
          fi
      - name: Create prerelease draft only; never publish automatically
        shell: bash
        run: |
          gh release create "$TAG" dist/arcxiom-*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Arcxiom v0.2.0a1 - experimental Rust kernel alpha' \
            --notes-file docs/releases/v0.2.0a1.md \
            --prerelease \
            --draft \
            --latest=false
