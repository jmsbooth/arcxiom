name: Prototype verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install prototype and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run positive, negative, and PDF tests
        run: python -m pytest -q
      - name: Smoke CLI and architecture export
        run: |
          arcxiom validate examples/emergency-response.arch.yaml
          arcxiom query examples/emergency-response.arch.yaml --id service.dispatch-api --depth 3
          arcxiom export examples/emergency-response.arch.yaml --format json --output example-archir.json
          arcxiom render examples/emergency-response.arch.yaml --format pdf --output example-drawing.pdf
